name: Run Python Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run complaint validator tests
        run: python -m unittest discover -s WUA_Week8_Unit_Testing -p "test_complaint_validator.py" -v

      - name: Run tax calculation tests
        run: python -m pytest WUA_Week8_Unit_Testing/test_calculate_tax.py -v